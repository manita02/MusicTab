services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: musictab
      POSTGRES_PASSWORD: musictab
      POSTGRES_DB: musictab
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musictab -d musictab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://musictab:musictab@db:5432/musictab
      - DIRECT_URL=postgresql://musictab:musictab@db:5432/musictab
      - PORT=3000
      - CORS_ORIGIN=http://localhost:5173
      - JWT_SECRET=holo
      - SEED_ON_BOOT=true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
      - VITE_BACKEND_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  pg-data:

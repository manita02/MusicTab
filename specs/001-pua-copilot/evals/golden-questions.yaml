# Golden questions — classify Pua (as-is)
# Cada caso: utterance → intent + slots esperados.
# Idioma de la pregunta: en | es. Reply del producto sigue siendo inglés.
# Usar en evals con Gemini mockeado o revisión manual. No son tests ejecutables todavía (ver tasks T-010).

version: 1
notes: >
  Slots omitidos se esperan ausentes. artist/genre/instrument/title son aproximados
  (el modelo puede devolver mayúsculas canónicas). Desambiguación: spec.md §10.

cases:
  # --- search_catalog ---
  - id: SC-EN-01
    intent: search_catalog
    lang: en
    utterance: Are there tabs by Milo J?
    slots: { artist: "Milo J" }
  - id: SC-ES-01
    intent: search_catalog
    lang: es
    utterance: "¿hay tabs de Milo J?"
    slots: { artist: "Milo J" }
  - id: SC-EN-02
    intent: search_catalog
    lang: en
    utterance: Do you have Bohemian Rhapsody?
    slots: { title: "Bohemian Rhapsody" }
  - id: SC-ES-02
    intent: search_catalog
    lang: es
    utterance: buscá Rara Vez
    slots: { title: "Rara Vez" }
  - id: SC-EN-03
    intent: search_catalog
    lang: en
    utterance: Rock by Milo J
    slots: { artist: "Milo J", genre: "Rock" }

